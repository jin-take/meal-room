name: Deploy Web to CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
      - '.agents/skills/deploy-web-cloudfront/**'
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  configuration:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      WEB_S3_BUCKET: ${{ vars.WEB_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_CLOUDFRONT_BASE_URL: ${{ vars.VITE_CLOUDFRONT_BASE_URL }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ -n "$AWS_DEPLOY_ROLE_ARN" && -n "$AWS_REGION" && -n "$WEB_S3_BUCKET" && -n "$CLOUDFRONT_DISTRIBUTION_ID" && -n "$VITE_CLOUDFRONT_BASE_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CloudFront deployment is not configured. Set AWS_DEPLOY_ROLE_ARN and the required repository variables, including VITE_CLOUDFRONT_BASE_URL."
          fi

  build:
    name: Build React app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_CLOUDFRONT_BASE_URL: ${{ vars.VITE_CLOUDFRONT_BASE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: meal-room-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy S3 and invalidate CloudFront
    needs:
      - configuration
      - build
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      WEB_S3_BUCKET: ${{ vars.WEB_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meal-room-web-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Repair CloudFront request handling
        run: |
          set -euo pipefail
          repair_dir=$(mktemp -d)

          aws wafv2 get-web-acl \
            --scope CLOUDFRONT \
            --region us-east-1 \
            --name CreatedByCloudFront-592faa16 \
            --id 9768ec4b-9f79-4a68-a1cf-226ed80eca34 \
            --output json > "$repair_dir/web-acl.json"

          jq '
            if any(.WebACL.Rules[]; .Name == "AWS-AWSManagedRulesCommonRuleSet") then . else error("CommonRuleSet is missing") end
            | .WebACL.Rules |= map(
                if .Name == "AWS-AWSManagedRulesCommonRuleSet" then
                  .Statement.ManagedRuleGroupStatement.RuleActionOverrides =
                    (((.Statement.ManagedRuleGroupStatement.RuleActionOverrides // [])
                      | map(select(.Name != "SizeRestrictions_BODY")))
                    + [{"Name":"SizeRestrictions_BODY","ActionToUse":{"Count":{}}}])
                else . end
              )
            | {
                Name: .WebACL.Name,
                Scope: "CLOUDFRONT",
                Id: .WebACL.Id,
                DefaultAction: .WebACL.DefaultAction,
                Description: .WebACL.Description,
                Rules: .WebACL.Rules,
                VisibilityConfig: .WebACL.VisibilityConfig,
                LockToken: .LockToken,
                CustomResponseBodies: .WebACL.CustomResponseBodies,
                CaptchaConfig: .WebACL.CaptchaConfig,
                ChallengeConfig: .WebACL.ChallengeConfig,
                TokenDomains: .WebACL.TokenDomains,
                AssociationConfig: .WebACL.AssociationConfig
              }
            | with_entries(select(.value != null))
          ' "$repair_dir/web-acl.json" > "$repair_dir/web-acl-update.json"

          aws wafv2 update-web-acl \
            --region us-east-1 \
            --cli-input-json "file://$repair_dir/web-acl-update.json"

          aws cloudfront get-distribution-config \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --output json > "$repair_dir/distribution.json"
          distribution_etag=$(jq -r '.ETag' "$repair_dir/distribution.json")

          jq '
            .DistributionConfig
            | .DefaultCacheBehavior.AllowedMethods = {
                "Quantity": 3,
                "Items": ["GET", "HEAD", "OPTIONS"],
                "CachedMethods": {"Quantity": 2, "Items": ["GET", "HEAD"]}
              }
            | (.CacheBehaviors.Items // []) as $behaviors
            | ($behaviors | map(select(.PathPattern == "/*")) | first) as $data_behavior
            | if $data_behavior == null then error("The /* data behavior is missing") else . end
            | .CacheBehaviors.Items = (
                ($behaviors | map(select(.PathPattern != "/*" and .PathPattern != "rooms/*" and .PathPattern != "users/*")))
                + [
                    ($data_behavior | .PathPattern = "rooms/*"),
                    ($data_behavior | .PathPattern = "users/*")
                  ]
              )
            | .CacheBehaviors.Quantity = (.CacheBehaviors.Items | length)
          ' "$repair_dir/distribution.json" > "$repair_dir/distribution-update.json"

          aws cloudfront update-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --if-match "$distribution_etag" \
            --distribution-config "file://$repair_dir/distribution-update.json" \
            --output json > "$repair_dir/distribution-result.json"
          aws cloudfront wait distribution-deployed \
            --id "$CLOUDFRONT_DISTRIBUTION_ID"

          distribution_arn="arn:aws:cloudfront::397014254965:distribution/$CLOUDFRONT_DISTRIBUTION_ID"
          jq -n \
            --arg distribution_arn "$distribution_arn" \
            --arg bucket_arn "arn:aws:s3:::$WEB_S3_BUCKET" \
            '{
              Version: "2012-10-17",
              Statement: [
                {
                  Sid: "AllowCloudFrontRead",
                  Effect: "Allow",
                  Principal: {Service: "cloudfront.amazonaws.com"},
                  Action: "s3:GetObject",
                  Resource: ($bucket_arn + "/*"),
                  Condition: {StringEquals: {"AWS:SourceArn": $distribution_arn}}
                },
                {
                  Sid: "AllowCloudFrontDataWrites",
                  Effect: "Allow",
                  Principal: {Service: "cloudfront.amazonaws.com"},
                  Action: "s3:PutObject",
                  Resource: [($bucket_arn + "/rooms/*"), ($bucket_arn + "/users/*")],
                  Condition: {StringEquals: {"AWS:SourceArn": $distribution_arn}}
                }
              ]
            }' > "$repair_dir/bucket-policy.json"

          aws s3api put-bucket-policy \
            --bucket "$WEB_S3_BUCKET" \
            --policy "file://$repair_dir/bucket-policy.json"

          aws cloudfront get-distribution-config \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query '{DefaultMethods:DistributionConfig.DefaultCacheBehavior.AllowedMethods.Items,DataBehaviors:DistributionConfig.CacheBehaviors.Items[].{Path:PathPattern,Methods:AllowedMethods.Items}}' \
            --output json
          aws wafv2 get-web-acl \
            --scope CLOUDFRONT \
            --region us-east-1 \
            --name CreatedByCloudFront-592faa16 \
            --id 9768ec4b-9f79-4a68-a1cf-226ed80eca34 \
            --query 'WebACL.Rules[?Name==`AWS-AWSManagedRulesCommonRuleSet`].Statement.ManagedRuleGroupStatement.RuleActionOverrides' \
            --output json
      - name: Upload immutable assets
        run: |
          aws s3 sync dist/assets "s3://$WEB_S3_BUCKET/assets" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable'
      - name: Upload icon without long cache
        run: |
          aws s3 cp dist/icon-meal-room-transparent.png \
            "s3://$WEB_S3_BUCKET/icon-meal-room-transparent.png" \
            --cache-control 'no-cache' \
            --content-type 'image/png'
      - name: Upload HTML without long cache
        run: |
          aws s3 cp dist/index.html "s3://$WEB_S3_BUCKET/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'
      - name: Invalidate CloudFront cache
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
      - name: Deployment summary
        run: |
          {
            echo '## Web deployment completed'
            echo
            echo "- S3 bucket: \`$WEB_S3_BUCKET\`"
            echo "- CloudFront distribution: \`$CLOUDFRONT_DISTRIBUTION_ID\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
